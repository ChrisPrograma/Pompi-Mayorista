<title>Pompi Mayorista</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Asap:wght@400;500;600;700&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  --ground:#EDF1EF;
  --surface:#FFFFFF;
  --surface-2:#F5F8F6;
  --sunk:#E4EBE8;
  --ink:#132320;
  --ink-2:#41564F;
  --ink-3:#728a82;
  --line:#D9E3DF;
  --line-strong:#C2D2CC;

  --brand:#0A6E75;
  --brand-deep:#075057;
  --brand-soft:#D7ECEC;
  --brand-ink:#064A50;

  --accent:#EE6C2B;
  --accent-deep:#CC551A;
  --accent-soft:#FCE6D8;

  --gold:#D99411;
  --gold-soft:#FAEDD2;

  --ok:#2F8F4E;
  --ok-soft:#DDF0E2;
  --warn:#B57A08;
  --warn-soft:#FAEED6;
  --bad:#C43F3F;
  --bad-soft:#FADFDF;

  --shadow-s:0 1px 2px rgba(11,40,35,.08);
  --shadow-m:0 4px 14px rgba(11,40,35,.10);
  --shadow-l:0 18px 44px rgba(11,40,35,.22);

  --r-s:10px; --r-m:16px; --r-l:22px;
  --bar:#0A6E75;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C1412;
    --surface:#16211F;
    --surface-2:#1C2927;
    --sunk:#111A18;
    --ink:#E7EFEC;
    --ink-2:#A9BDB7;
    --ink-3:#7D928C;
    --line:#273632;
    --line-strong:#33453F;

    --brand:#3FB6BD;
    --brand-deep:#8FDCE0;
    --brand-soft:#10312F;
    --brand-ink:#9CE1E4;

    --accent:#FF8A4C;
    --accent-deep:#FFA877;
    --accent-soft:#37211A;

    --gold:#E8B34A;
    --gold-soft:#332714;

    --ok:#5CC57D;
    --ok-soft:#13301D;
    --warn:#E0AC47;
    --warn-soft:#332715;
    --bad:#F07272;
    --bad-soft:#361A1A;

    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 4px 14px rgba(0,0,0,.45);
    --shadow-l:0 18px 44px rgba(0,0,0,.6);
    --bar:#3FB6BD;
  }
}
:root[data-theme="dark"]{
  --ground:#0C1412;
  --surface:#16211F;
  --surface-2:#1C2927;
  --sunk:#111A18;
  --ink:#E7EFEC;
  --ink-2:#A9BDB7;
  --ink-3:#7D928C;
  --line:#273632;
  --line-strong:#33453F;
  --brand:#3FB6BD;
  --brand-deep:#8FDCE0;
  --brand-soft:#10312F;
  --brand-ink:#9CE1E4;
  --accent:#FF8A4C;
  --accent-deep:#FFA877;
  --accent-soft:#37211A;
  --gold:#E8B34A;
  --gold-soft:#332714;
  --ok:#5CC57D;
  --ok-soft:#13301D;
  --warn:#E0AC47;
  --warn-soft:#332715;
  --bad:#F07272;
  --bad-soft:#361A1A;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 4px 14px rgba(0,0,0,.45);
  --shadow-l:0 18px 44px rgba(0,0,0,.6);
  --bar:#3FB6BD;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:'Asap','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.num{font-family:'Archivo','Asap',system-ui,sans-serif;font-variation-settings:'wdth' 112;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico-s{width:18px;height:18px}
.ico-xl{width:34px;height:34px}

/* ============ STAGE / PHONE ============ */
.stage{
  min-height:100dvh;
  display:flex; align-items:flex-start; justify-content:center;
  gap:26px;
  padding:0;
}
.phone{
  position:relative;
  width:100%; max-width:100%;
  height:100dvh;
  background:var(--ground);
  overflow:hidden;
  display:flex; flex-direction:column;
}
.app{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.presenter{display:none}

@media (min-width:820px){
  .stage{
    padding:28px 20px 28px;
    background:
      radial-gradient(1100px 520px at 18% -10%, color-mix(in srgb, var(--brand) 13%, transparent), transparent 70%),
      var(--ground);
    min-height:100dvh;
  }
  .phone{
    width:414px; height:min(880px, calc(100dvh - 56px));
    border-radius:40px;
    border:9px solid color-mix(in srgb, var(--ink) 82%, #000);
    box-shadow:var(--shadow-l);
    flex:0 0 auto;
  }
  .presenter{
    display:block; width:360px; flex:0 0 auto;
    align-self:stretch; max-height:calc(100dvh - 56px);
    overflow-y:auto;
  }
}
@media (min-width:820px) and (max-width:1120px){ .presenter{display:none} }

/* ============ HUD ============ */
.hud{
  flex:0 0 auto;
  background:linear-gradient(168deg, var(--brand-deep), var(--brand));
  color:#fff;
  padding:16px 18px 18px;
  display:flex; flex-direction:column; gap:14px;
}
:root[data-theme="dark"] .hud, :root:not([data-theme="light"]) .hud{color:#fff}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{
  width:34px;height:34px;border-radius:11px;flex:0 0 auto;
  background:rgba(255,255,255,.17);
  display:grid;place-items:center;color:#fff;
}
.brand-name{font-family:'Archivo';font-variation-settings:'wdth' 118;font-weight:700;font-size:17px;letter-spacing:-.015em;line-height:1.1}
.brand-sub{font-size:11.5px;opacity:.72;letter-spacing:.04em;text-transform:uppercase}
.hud-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}
.hud-btn:hover{background:rgba(255,255,255,.24)}
.hud-money{display:flex;gap:10px}
.mtile{
  flex:1; background:rgba(255,255,255,.13); border-radius:var(--r-m);
  padding:10px 12px 11px; min-width:0;
}
.mtile b{display:block;font-family:'Archivo';font-variation-settings:'wdth' 108;font-weight:700;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.mtile span{font-size:11.5px;opacity:.8;display:block;letter-spacing:.02em}
.mtile.hot{background:rgba(255,255,255,.22)}

/* ============ VIEW ============ */
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.view{padding:16px 16px 26px;display:flex;flex-direction:column;gap:14px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:2px}
.section-h h2{font-size:16.5px;font-weight:700}
.section-h .hint{font-size:12.5px;color:var(--ink-3)}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.card{background:var(--surface);border-radius:var(--r-m);border:1px solid var(--line);padding:14px}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:10px}

/* alerts */
.alert{
  display:flex;gap:12px;align-items:flex-start;
  border-radius:var(--r-m);padding:13px 14px;
  border:1px solid transparent;
}
.alert .ico{flex:0 0 auto;margin-top:1px}
.alert p{margin:2px 0 0;font-size:13.5px;line-height:1.4}
.alert strong{font-size:14.5px;display:block;font-family:'Archivo';font-variation-settings:'wdth' 110}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent);color:var(--ink)}
.alert.bad .ico{color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.alert.warn .ico{color:var(--warn)}
.alert.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.alert.ok .ico{color:var(--ok)}
.alert-act{margin-left:auto;align-self:center;font-weight:600;font-size:13px;color:var(--brand);white-space:nowrap;display:flex;align-items:center;gap:3px}

/* misiones */
.misiones{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.mis-head{padding:13px 14px 11px;display:flex;align-items:center;gap:11px}
.mis-head .ico{color:var(--gold)}
.mis-head h3{font-size:15px;font-weight:700;flex:1}
.mis-count{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:600}
.progress{height:7px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:0 14px 12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.mis-list{list-style:none;margin:0;padding:0 0 4px}
.mis-list li{display:flex;align-items:center;gap:11px;padding:9px 14px;font-size:14.5px;border-top:1px solid var(--line)}
.tick{width:23px;height:23px;border-radius:50%;border:2px solid var(--line-strong);flex:0 0 auto;display:grid;place-items:center;color:transparent}
.mis-list li.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.mis-list li.done{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.mis-go{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:4px 10px;border-radius:99px}

/* big action */
.big-action{
  width:100%;display:flex;align-items:center;gap:14px;
  background:linear-gradient(150deg,var(--accent),var(--accent-deep));
  color:#fff;border-radius:var(--r-l);padding:18px 18px;
  box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 38%,transparent);
  text-align:left;
}
.big-action:active{transform:translateY(1px)}
.big-action .circ{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:0 0 auto}
.big-action b{display:block;font-family:'Archivo';font-variation-settings:'wdth' 114;font-size:20px;font-weight:700;line-height:1.1}
.big-action span{font-size:13px;opacity:.9}
.big-action .ico-arrow{margin-left:auto;opacity:.85}
.second-action{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--surface);border:1.6px solid var(--line-strong);border-radius:var(--r-m);padding:12px 14px;
}
.second-action:active{background:var(--surface-2)}
.second-action .circ{width:38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:0 0 auto}
.second-action b{display:block;font-family:'Archivo';font-variation-settings:'wdth' 110;font-size:15.5px;font-weight:700;line-height:1.15}
.second-action span span{font-size:12.6px;color:var(--ink-3)}
.second-action .ico-arrow{margin-left:auto;color:var(--ink-3)}

/* rows */
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:12px 13px;
}
.row + .row{margin-top:0}
.row:active{background:var(--surface-2)}
.thumb{
  width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand-ink);
}
.thumb.c-juguete{background:var(--accent-soft);color:var(--accent-deep)}
.thumb.c-higiene{background:var(--gold-soft);color:var(--gold)}
.thumb.c-descanso{background:var(--ok-soft);color:var(--ok)}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-size:14.6px;font-weight:600;line-height:1.25;overflow-wrap:break-word;text-wrap:pretty}
.row-main span{font-size:12.6px;color:var(--ink-3);display:block}
.row-end{text-align:right;flex:0 0 auto}
.row-end b{display:block;font-family:'Archivo';font-variation-settings:'wdth' 106;font-size:16px;font-variant-numeric:tabular-nums}
.row-end span{font-size:11.8px;color:var(--ink-3)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.8px;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.01em}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.brand{background:var(--brand-soft);color:var(--brand-ink)}
.pill.mute{background:var(--sunk);color:var(--ink-3)}

/* stepper + vender */
.steps{display:flex;gap:6px;padding:0 0 2px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--sunk)}
.steps i.on{background:var(--brand)}
.step-title{display:flex;align-items:center;gap:10px}
.step-title h2{font-size:19px;font-weight:700}
.step-title .n{width:26px;height:26px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:'Archivo';font-weight:700;font-size:14px;flex:0 0 auto}

.qty{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.qbtn{width:34px;height:34px;border-radius:11px;background:var(--sunk);color:var(--ink);display:grid;place-items:center;border:1px solid var(--line)}
.qbtn.plus{background:var(--brand);color:#fff;border-color:var(--brand)}
.qbtn:disabled{opacity:.35}
.qnum{min-width:22px;text-align:center;font-family:'Archivo';font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}

.cartbar{
  position:sticky;bottom:0;margin:6px -16px -26px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
  box-shadow:0 -6px 18px rgba(11,40,35,.08);
}
.cartbar .tot span{font-size:11.8px;color:var(--ink-3);display:block;line-height:1.1}
.cartbar .tot b{font-family:'Archivo';font-variation-settings:'wdth' 108;font-size:22px;font-variant-numeric:tabular-nums;display:block}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:14px;font-weight:700;font-size:15.5px;
  background:var(--brand);color:#fff;
}
.btn.accent{background:var(--accent)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.outline{background:transparent;border:1.6px solid var(--line-strong);color:var(--ink)}
.btn:disabled{opacity:.4}
.btn.block{width:100%}
.btn.lg{padding:16px 20px;font-size:17px;border-radius:16px}

.pay-opt{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:15px 15px;border-radius:var(--r-m);border:1.6px solid var(--line);background:var(--surface);
}
.pay-opt .thumb{width:42px;height:42px}
.pay-opt b{display:block;font-size:15.5px;font-weight:600}
.pay-opt span{font-size:12.6px;color:var(--ink-3)}
.pay-opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.pay-opt.debt[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft)}

/* hub */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hub button{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:15px 14px 14px;text-align:left;display:flex;flex-direction:column;gap:9px;min-height:118px;
}
.hub .thumb{width:40px;height:40px}
.hub b{font-size:15px;font-weight:700;line-height:1.2;display:block}
.hub span{font-size:12.3px;color:var(--ink-3);line-height:1.25;margin-top:auto}

/* chart */
.chart{display:flex;align-items:flex-end;gap:7px;height:150px;padding-top:22px}
.cbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px;position:relative}
.cbar i{
  display:block;width:100%;background:var(--bar);border-radius:4px 4px 0 0;
  min-height:3px;transition:height .6s cubic-bezier(.2,.8,.2,1);
}
.cbar.dim i{background:color-mix(in srgb,var(--bar) 42%, var(--surface))}
.cbar.zero i{background:var(--line-strong)}
.cbar em{font-style:normal;font-size:11px;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.cbar.today em{color:var(--ink);font-weight:700}
.cbar b{
  position:absolute;top:-20px;left:50%;transform:translateX(-50%);
  font-family:'Archivo';font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2);
  background:var(--surface);padding:1px 4px;border-radius:5px;
}
.cbar:hover b, .cbar:focus-within b{color:var(--ink);box-shadow:var(--shadow-s)}
.cbar .tip{display:none}
.cbar:hover .tip,.cbar:focus-within .tip{
  display:block;position:absolute;bottom:calc(100% + 24px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--ground);font-size:12px;padding:5px 9px;border-radius:8px;white-space:nowrap;z-index:5;
  font-variant-numeric:tabular-nums;box-shadow:var(--shadow-m);
}

.rank{display:flex;flex-direction:column;gap:11px}
.rank-item{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.rank-item b{font-size:14px;font-weight:600}
.rank-item em{font-style:normal;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-family:'Archivo'}
.rank-track{grid-column:1/-1;height:9px;background:var(--sunk);border-radius:99px;overflow:hidden}
.rank-track i{display:block;height:100%;background:var(--bar);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rank-item:nth-child(2) .rank-track i{background:color-mix(in srgb,var(--bar) 82%,var(--surface))}
.rank-item:nth-child(3) .rank-track i{background:color-mix(in srgb,var(--bar) 66%,var(--surface))}
.rank-item:nth-child(4) .rank-track i{background:color-mix(in srgb,var(--bar) 50%,var(--surface))}
.rank-item:nth-child(5) .rank-track i{background:color-mix(in srgb,var(--bar) 38%,var(--surface))}

.hero-n{padding:18px 16px 16px;text-align:center;background:linear-gradient(165deg,var(--brand-deep),var(--brand));color:#fff;border-radius:var(--r-l)}
.hero-n span{font-size:12.5px;opacity:.82;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.hero-n b{display:block;font-family:'Archivo';font-variation-settings:'wdth' 104;font-size:40px;font-weight:800;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero-n em{font-style:normal;font-size:13.5px;opacity:.9}

.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 13px}
.kpi b{display:block;font-family:'Archivo';font-size:19px;font-variant-numeric:tabular-nums;font-weight:700}
.kpi span{font-size:12.2px;color:var(--ink-3)}

/* tabbar */
.tabbar{
  flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;color:var(--ink-3);border-radius:12px}
.tab span{font-size:10.8px;font-weight:600;letter-spacing:.005em}
.tab[aria-current="true"]{color:var(--brand)}
.tab[aria-current="true"] .ico{stroke-width:2.3}
.tab.sell{color:var(--accent)}
.tab.sell[aria-current="true"]{color:var(--accent)}

/* sheets */
.sheet-layer{position:absolute;inset:0;z-index:60;display:none}
.sheet-layer.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(6,20,17,.55);animation:fade .2s ease}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;
  background:var(--surface);border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .28s cubic-bezier(.2,.85,.25,1);
}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line-strong);margin:6px auto 12px}
.sheet h3{font-size:19px;font-weight:700;margin-bottom:4px}
.sheet .sub{font-size:13.5px;color:var(--ink-3);margin:0 0 14px}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.amount-in{
  width:100%;font-family:'Archivo';font-variation-settings:'wdth' 106;font-size:30px;font-weight:700;
  text-align:center;padding:14px;border-radius:var(--r-m);border:1.6px solid var(--line-strong);

.coach{

/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const fmt = n => '$' + new Intl.NumberFormat('es-AR').format(Math.round(n));
const fmtK = n => n >= 1000000 ? '$'+(n/1000000).toFixed(n>=10000000?0:1).replace('.',',')+' M'
                : n >= 1000 ? '$'+Math.round(n/1000)+' mil' : fmt(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon = (id, cls) => `<svg class="ico ${cls||''}" aria-hidden="true"><use href="#${id}"/></svg>`;
const catIcon = c => `p-${c}`;
const prod = id => S.productos.find(p=>p.id===id);
const cli = id => S.clientes.find(c=>c.id===id);
const prov = id => S.proveedores.find(v=>v.id===id);
const totalDeuda = () => S.clientes.reduce((a,c)=>a+c.debe,0);
const totalDebo = () => S.proveedores.reduce((a,v)=>a+v.debo,0);
const ingTotal = () => Object.entries(ingreso.items).reduce((a,[id,q])=>a+prod(id).cn*q,0);
const ingUnits = () => Object.values(ingreso.items).reduce((a,q)=>a+q,0);
const precioSug = p => Math.round(p.precio * (p.cn/p.costo) / 100) * 100;
const vendidoHoy = () => S.ventasHoy.reduce((a,v)=>a+v.total,0);
const enAuto = () => S.productos.reduce((a,p)=>a+p.auto,0);
const faltaCargar = () => S.productos.reduce((a,p)=>a+Math.max(0,Math.min(p.sug-p.auto, p.dep)),0);
const cartTotal = () => Object.entries(venta.items).reduce((a,[id,q])=>a+prod(id).precio*q,0);
const cartUnits = () => Object.values(venta.items).reduce((a,q)=>a+q,0);
const misDone = () => Object.values(S.misiones).filter(Boolean).length;

  ingreso:'cosas', proveedores:'cosas', incluye:'hoy'};
function renderTabs(){
  const active = SUB[route] || route;

    <div class="progress"><i style="width:${misDone()/3*100}%"></i></div>
    <ul class="mis-list">

function cerrarVenta(){
  const c = cli(venta.cli);
  const tot = cartTotal();
  const units = cartUnits();
  Object.entries(venta.items).forEach(([id,q])=>{ prod(id).auto -= q; });
  const cobrado = venta.forma==='Me lo debe' ? 0 : tot;
  if(cobrado) S.cobradoHoy += tot; else { c.debe += tot; if(c.dias===0) c.dias = 1; }
  c.visitado = true; c.ult = 'Hoy';
  S.ventasHoy.push({cli:c.n, items:units, total:tot, cobrado, forma:venta.forma, hora:hora()});
  S.misiones.venta = true;
  showSuccess({
    title:'¡Venta cerrada!', amount:tot,
    text: cobrado ? `${c.n} te pagó en el momento.` : `Quedó anotado que ${c.n} te lo debe. No hace falta que te acuerdes.`,
    deltas: cobrado
      ? [{l:'Cobraste hoy', v:fmt(S.cobradoHoy)},{l:'Productos', v:units+' u.'}]
      : [{l:'Ahora te debe', v:fmt(c.debe)},{l:'Productos', v:units+' u.'}]
  });
  venta = {cli:null, items:{}, step:1, forma:null};
  route = 'hoy'; render(false);
}

function cerrarIngreso(){
  const v = prov(ingreso.prov);
  const tot = ingTotal(), units = ingUnits();
  S.subieron = [];
  Object.entries(ingreso.items).forEach(([id,q])=>{
    const p = prod(id);
    p.dep += q;
    if(p.cn > p.costo){ S.subieron.push({id:p.id, viejo:p.costo, nuevo:p.cn, sug:precioSug(p)}); p.costo = p.cn; }
  });
  if(ingreso.forma==='Se lo debo'){ v.debo += tot; if(v.dias===0) v.dias = 1; }
  v.ult = 'Hoy';
  const sub = S.subieron.length;
  showSuccess({
    title:'Mercadería entrada', amount:`${units} u.`,
    text:`Sumaste ${units} unidades a tu casa por ${fmt(tot)}. ${ingreso.forma==='Se lo debo'?`Le quedás debiendo ${fmt(v.debo)} a ${v.n}.`:`Quedaste al día con ${v.n}.`}`,
    deltas:[{l:'Ahora tenés en casa', v:S.productos.reduce((a,p)=>a+p.dep,0)+' u.'},{l:'Te salió', v:fmt(tot)}],
    extra: sub ? `<div class="warn-box">${icon('i-tag')}<div><b>${sub} ${sub===1?'producto te llegó':'productos te llegaron'} más caro${sub===1?'':'s'}</b>
        <span>Si no tocás tus precios, ganás menos sin darte cuenta.</span></div>
        <button class="btn" data-precios="1">Revisar mis precios</button></div>` : ''
  });
  ingreso = {prov:null, items:{}, step:1, forma:null};
  route = 'cosas'; render(false);
}

    <button class="btn outline block" data-close="1" style="margin-top:9px">Ahora no</button>`);
}
function registrarPagoProv(id, monto){
  const v = prov(id);
  monto = Math.max(0, Math.min(monto, v.debo));
  if(!monto) return;
  v.debo -= monto;
  if(v.debo===0) v.dias = 0;
  closeSheet();
  showSuccess({
    title:'Pago registrado', amount:monto,
    text: v.debo? `Todavía le debés ${fmt(v.debo)} a ${v.n}.` : `Quedaste al día con ${v.n}.`,
    deltas:[{l:'Le debés', v:fmt(v.debo)},{l:'Debés en total', v:fmt(totalDebo())}]
  });
  render(false);
}

function registrarPago(id, monto){
  const c = cli(id);
  monto = Math.max(0, Math.min(monto, c.debe));
  if(!monto) return;
  c.debe -= monto;
  S.cobradoHoy += monto;
  if(c.debe===0) c.dias = 0;
  S.misiones.cobro = true;
  closeSheet();
  showSuccess({
    title:'¡Cobrado!', amount:monto,
    text: c.debe? `${c.n} todavía te debe ${fmt(c.debe)}.` : `${c.n} quedó al día con vos.`,
    deltas:[{l:'Cobraste hoy', v:fmt(S.cobradoHoy)},{l:'Te siguen debiendo', v:fmt(totalDeuda())}]
  });
  render(false);
}

function cargarAuto(){
  let mov = 0;
  S.productos.forEach(p=>{
    const f = Math.max(0, Math.min(p.sug-p.auto, p.dep));
    p.auto += f; p.dep -= f; mov += f;
  });
  S.misiones.carga = true;
  showSuccess({
    title:'Auto cargado', amount:`${mov} u.`,
    text:'Subiste lo que te faltaba para cubrir la ruta. Salís tranquilo.',
    deltas:[{l:'En el auto', v:enAuto()+' u.'},{l:'En tu casa', v:S.productos.reduce((a,p)=>a+p.dep,0)+' u.'}]
  });
  render(false);
}
function hora(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function startTour(){ closeSheet(); tourIdx = 0; showTour(); }
function endTour(){ tourIdx = -1; $('#coach').classList.remove('on'); clearTourTarget(); }
function showTour(){
  const s = TOUR[tourIdx];
  route = s.r;
  if(s.r==='vender'){
    if(s.t==='lista-prod'){ venta = {cli:'c6', items:{p6:12, p13:6}, step:2, forma:null}; }
    else { venta = {cli:null, items:{}, step:1, forma:null}; }
  }
  if(s.r==='ingreso'){ ingreso = {prov:'v1', items:{p1:36, p3:8}, step:2, forma:null}; }
  render(false);
  $('#coach').innerHTML = `
    <div class="ceyebrow">Paso ${tourIdx+1} de ${TOUR.length}</div>
    <h4>${s.h}</h4>
    <p>${s.p}</p>
    <div class="coach-foot">
      <span class="coach-dots">${TOUR.map((_,i)=>`<i class="${i<=tourIdx?'on':''}"></i>`).join('')}</span>
      <button class="link" data-tour="end">Salir</button>
      <button class="btn accent" data-tour="next">${tourIdx===TOUR.length-1?'Terminar':'Siguiente'}</button>
    </div>`;
  $('#coach').classList.add('on');
}
function clearTourTarget(){ document.querySelectorAll('.tour-target').forEach(e=>e.classList.remove('tour-target')); }
function paintTourTarget(){
  clearTourTarget();
  const s = TOUR[tourIdx]; if(!s || !s.t) return;
  const el = s.t==='precio-sube'
    ? document.querySelector('.up')?.closest('.row')
    : document.querySelector(`[data-tour="${s.t}"]`);
  if(el){ el.classList.add('tour-target'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
}

/* ============================ EVENTOS ============================ */
document.addEventListener('click', e=>{
  const el = t => e.target.closest(`[${t}]`);
  let x;

  if(x = el('data-okdone')){ $('#success').classList.remove('on'); return; }
  if(x = el('data-close')){ closeSheet(); return; }

  if(x = el('data-tour')){
    const v = x.getAttribute('data-tour');
    if(v==='start'){ startTour(); return; }
    if(v==='end'){ endTour(); return; }
    if(v==='next'){ tourIdx++; if(tourIdx>=TOUR.length){ endTour(); } else showTour(); return; }
  }
  if(x = el('data-reset')){ S = seed(); venta={cli:null,items:{},step:1,forma:null}; ingreso={prov:null,items:{},step:1,forma:null}; endTour(); closeSheet(); $('#success').classList.remove('on'); go('hoy'); return; }
  if(x = el('data-go')){ closeSheet(); go(x.getAttribute('data-go')); return; }

  if(e.target.closest('#btnMenu')){ sheetMenu(); return; }

  if(x = el('data-pickcli')){ venta.cli = x.getAttribute('data-pickcli'); venta.step = 2; render(false); return; }
  if(x = el('data-nuevo')){
    sheet(`<h3>Comercio nuevo</h3><p class="sub">En la versión final se carga acá con el nombre, la zona y el día que lo visitás. Tres campos, nada más.</p>
      <button class="btn block" data-close="1">Entendido</button>`); return;
  }
  if(x = el('data-step')){ venta.step = +x.getAttribute('data-step'); render(false); return; }
  if(x = el('data-q')){
    const id = x.getAttribute('data-p'), d = +x.getAttribute('data-q');
    const q = (venta.items[id]||0) + d;
    if(q<=0) delete venta.items[id]; else venta.items[id] = Math.min(q, prod(id).auto);
    render(true); return;
  }
  if(x = el('data-pay')){ venta.forma = x.getAttribute('data-pay'); render(true); return; }
  if(x = el('data-cerrar')){ if(venta.forma) cerrarVenta(); return; }

  if(x = el('data-pickprov')){ ingreso.prov = x.getAttribute('data-pickprov'); ingreso.step = 2; render(false); return; }
  if(x = el('data-nuevoprov')){
    sheet(`<h3>Proveedor nuevo</h3><p class="sub">En la versión final lo cargás con el nombre y el rubro, y después le asociás los productos que le comprás.</p>
      <button class="btn block" data-close="1">Entendido</button>`); return;
  }
  if(x = el('data-istep')){ ingreso.step = +x.getAttribute('data-istep'); render(false); return; }
  if(x = el('data-iq')){
    const id = x.getAttribute('data-p'), d = +x.getAttribute('data-iq');
    const q = (ingreso.items[id]||0) + d;
    if(q<=0) delete ingreso.items[id]; else ingreso.items[id] = q;
    render(true); return;
  }
  if(x = el('data-ipay')){ ingreso.forma = x.getAttribute('data-ipay'); render(true); return; }
  if(x = el('data-icerrar')){ if(ingreso.forma) cerrarIngreso(); return; }
  if(x = el('data-precios')){ sheetPrecios(); return; }
  if(x = el('data-aplicar')){ aplicarPrecios(); return; }
  if(x = el('data-prov')){ sheetProveedor(x.getAttribute('data-prov')); return; }
  if(x = el('data-pedira')){
    closeSheet();
    ingreso = {prov:x.getAttribute('data-pedira'), items:{}, step:2, forma:null};
    route = 'ingreso'; render(false); return;
  }
  if(x = el('data-pagarprov')){ sheetPagoProv(x.getAttribute('data-pagarprov')); return; }
  if(x = el('data-pagoprov')){ registrarPagoProv(x.getAttribute('data-pagoprov'), parseInt(String($('#montoIn').value).replace(/\D/g,''))||0); return; }

  if(x = el('data-cobrar')){ sheetCobro(x.getAttribute('data-cobrar')); return; }
  if(x = el('data-monto')){
    $('#montoIn').value = x.getAttribute('data-monto');
    document.querySelectorAll('[data-monto]').forEach(b=>b.setAttribute('aria-pressed', b===x));
    return;
  }
  if(x = el('data-pago')){ registrarPago(x.getAttribute('data-pago'), parseInt(String($('#montoIn').value).replace(/\D/g,''))||0); return; }

  if(x = el('data-cliente')){ sheetCliente(x.getAttribute('data-cliente')); return; }
  if(x = el('data-prod')){ sheetProducto(x.getAttribute('data-prod')); return; }
  if(x = el('data-vendera')){
    closeSheet();
    venta = {cli:x.getAttribute('data-vendera'), items:{}, step:2, forma:null};
    route = 'vender'; render(false); return;
  }
  if(x = el('data-visita')){ const c = cli(x.getAttribute('data-visita')); c.visitado = !c.visitado; render(true); return; }

  if(x = el('data-mv')){
    const p = prod(x.getAttribute('data-p')), d = +x.getAttribute('data-mv');
    if(d>0 && p.dep>0){ p.dep--; p.auto++; }
    if(d<0 && p.auto>0){ p.auto--; p.dep++; }
    render(true); return;
  }
  if(x = el('data-cargar')){ cargarAuto(); return; }
});

render(false);
})();
